[package]
name = "git-rs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Bounded cooperative Git computation core"

[dependencies]
gix-actor = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.44.1", default-features = false }
gix-blame = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.20.0", default-features = false }
gix-diff = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.70.0", default-features = false, features = ["blob"] }
gix-filter = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.36.1", default-features = false }
gix-glob = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.29.1", default-features = false }
gix-worktree = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.59.0", default-features = false, features = ["attributes"] }
gix-object = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.66.1", default-features = false }
gix-hash = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.28.1", default-features = false, features = ["sha1"] }
gix-pack = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.77.0", default-features = false, features = ["generate", "streaming-input"] }
gix-packetline = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.24.1", default-features = false, features = ["blocking-io"] }
gix-validate = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.13.1", default-features = false }
gix-error = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.5.2" }
gix-zlib = { git = "https://github.com/borislitv/gitoxide", rev = "0d1d6a3e1bf4b5e698fe026d00438f34f49908c3", version = "=0.4.0", default-features = false }
hashbrown = { version = "=0.17.1", default-features = false }
iconv-native = { git = "https://github.com/borislitv/iconv-native-rs", rev = "f8022d89dfe9e9fd2a6e3ce0bac5a68a4c77e89f", version = "=0.1.0", default-features = false, features = ["libc-iconv"] }
sha2 = "=0.11.1"

[dev-dependencies]
memfd = "0.6.6"
