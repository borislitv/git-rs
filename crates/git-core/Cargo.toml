[package]
name = "git-rs-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Bounded cooperative Git computation core"

[dependencies]
gix-object = { version = "=0.66.1", default-features = false }
gix-hash = { version = "=0.28.1", default-features = false, features = ["sha1"] }
gix-pack = { version = "=0.77.0", default-features = false }
gix-error = "=0.5.2"
gix-zlib = { version = "=0.4.0", default-features = false }
hashbrown = { version = "=0.17.1", default-features = false }

[dev-dependencies]
memfd = "0.6.6"
