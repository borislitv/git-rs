[package]
name = "git-rs"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.99"
description = "Experimental stateless Git backend with PostgreSQL and immutable S3 packs"

[workspace]
resolver = "2"
members = [".", "crates/git-core"]
exclude = ["vendor/gitoxide", "vendor/gitoxide/*", "vendor/gitoxide/tests/tools"]

[dependencies]
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
deadpool-postgres = "0.14.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
git-rs-core = { version = "0.1.0", path = "crates/git-core" }
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
memfd = "0.6.6"
native-tls = "0.2"
openssl = "0.10"
percent-encoding = "2.3.2"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "fs"] }
tokio-postgres = "0.7.18"
tokio-util = { version = "0.7", features = ["io"] }
tracing-appender = { version = "0.2.5", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[[bench]]
name = "cache"
harness = false

[[example]]
name = "cache-process"
path = "tests/support/cache_process.rs"

# One source for the complete manifest closure, including optional dependencies.
# The source auditor rejects registry/fork duplicates in the resolved lockfile.
[patch.crates-io]
gix = { path = "vendor/gitoxide/gix" }
gix-actor = { path = "vendor/gitoxide/gix-actor" }
