[package]
name = "git-rs"
version = "0.1.0-rc.3"
edition = "2024"
rust-version = "1.99"
description = "Experimental stateless Git backend with PostgreSQL and immutable S3 packs"

[workspace]
resolver = "2"
members = ["crates/git-core"]
exclude = [".local/iconv-native", ".local/zstd-rs"]

[dependencies]
aws-credential-types = "1.3.1"
aws-sigv4 = { version = "1.6.4", default-features = false, features = ["sign-http", "http1"] }
deadpool-postgres = "0.14.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
git-rs-core = { version = "0.1.0", path = "crates/git-core" }
gix = { git = "https://github.com/borislitv/gitoxide", rev = "512750f176546e7064b05616be8805caac92d260", version = "0.90.0", default-features = false, features = ["sha1"] }
gix-packetline = { git = "https://github.com/borislitv/gitoxide", rev = "512750f176546e7064b05616be8805caac92d260", version = "=0.24.1", default-features = false, features = ["blocking-io"] }
k8s-openapi = { version = "=0.25.0", default-features = false, features = ["v1_33"] }
kube-client = { version = "=1.1.0", default-features = false, features = ["client", "config", "openssl-tls"] }
kubert = { git = "https://github.com/borislitv/kubert", rev = "5ebc70e236e14852c82ace1dc772e3c48c1839f7", version = "=0.25.0", default-features = false, features = ["lease", "openssl-tls"] }
native-tls = "0.2"
openssl = "0.10"
percent-encoding = "2.3.2"
postgres-native-tls = "0.5.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
quick-xml = { version = "=0.42.0", default-features = false, features = ["serialize"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "event", "fs", "net", "pipe"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "signal", "net"] }
tokio-postgres = "0.7.18"
tracing-appender = { version = "0.2.5", default-features = false }
zstd = { git = "https://github.com/borislitv/zstd-rs", rev = "a6adf4a49ab3b43e2b0279a4257f79dcc164478f", default-features = false, features = ["experimental", "vendored"] }

[dev-dependencies]
memfd = "0.6.6"
tokio = { version = "1", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[[bench]]
name = "cache"
harness = false

[[example]]
name = "cache-process"
path = "tests/support/cache_process.rs"

[[example]]
name = "blame-http-fixture"
path = "tests/support/blame_http.rs"
