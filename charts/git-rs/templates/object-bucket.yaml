{{- if .Values.objectBucket.enabled }}
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: {{ include "git-rs.bucketClaim" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- toYaml .Values.objectBucket.annotations | nindent 4 }}
    helm.sh/resource-policy: keep
spec:
  storageClassName: {{ .Values.objectBucket.storageClassName | quote }}
  {{- if .Values.objectBucket.bucketName }}
  bucketName: {{ .Values.objectBucket.bucketName | quote }}
  {{- else }}
  generateBucketName: {{ include "git-rs.bucketClaim" . | quote }}
  {{- end }}
  {{- with .Values.objectBucket.additionalConfig }}
  additionalConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
