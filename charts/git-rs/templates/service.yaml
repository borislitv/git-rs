{{- if .Values.ssh.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-rs.fullname" . }}
  labels:
    {{- include "git-rs.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "git-rs.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: {{ .Values.service.sshPort }}
      targetPort: ssh
{{- end }}
