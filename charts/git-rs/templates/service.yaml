{{- if or .Values.ssh.enabled .Values.http.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-rs.fullname" . }}
  labels:
    {{- include "git-rs.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "git-rs.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: serving
  ports:
    {{- if .Values.ssh.enabled }}
    - name: ssh
      port: {{ .Values.service.sshPort }}
      targetPort: ssh
    {{- end }}
    {{- if .Values.http.enabled }}
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
    {{- end }}
{{- end }}
