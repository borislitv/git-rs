# Operators and their CRDs are preinstalled. This chart has no dependencies.
# Create SSH Secrets and the two CA/certificate Secrets before installation.
replicaCount: 3
ssh:
  hostKeysSecret: git-rs-ssh-host-keys
  authorizedKeysSecret: git-rs-ssh-authorized-keys
postgresql:
  database: git_rs
  username: git_rs
cnpg:
  enabled: true
  spec:
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-bookworm@sha256:605c6e45e733ce0e908505e9ac3c441637d6794d330ec0e9d8d6f631b6918b1e
    storage:
      size: 40Gi
      storageClass: fast-block
    postgresql:
      synchronous:
        method: any
        number: 1
        dataDurability: required
s3:
  caSecret: git-rs-s3-ca
rookCeph:
  namespace: rook-ceph
  # Reuse an existing CephCluster. Create only its dedicated object store,
  # Retain StorageClass, and application bucket claim.
  objectStore:
    enabled: true
    name: git-rs
    spec:
      preservePoolsOnDelete: true
      metadataPool:
        replicated:
          size: 3
        failureDomain: host
      dataPool:
        replicated:
          size: 3
        failureDomain: host
      gateway:
        instances: 2
        securePort: 443
        # Existing TLS Secret in rook-ceph. Certificate SAN must cover
        # rook-ceph-rgw-git-rs.rook-ceph.svc, matching s3.endpoint.
        sslCertificateRef: git-rs-rgw-tls
  storageClass:
    enabled: true
    name: git-rs-buckets
    provisioner: rook-ceph.ceph.rook.io/bucket
  bucket:
    enabled: true
